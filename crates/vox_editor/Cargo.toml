[package]
name = "vox_editor"
edition = "2021"
version.workspace = true

[features]
# `crucible` enables the node-graph editor windows (material/vfx/anim editor UI)
# that consume vox_nodes' crucible-backed OchrGraph + vox_ui's NodeGraphWidget.
# Default-on so the editor UI moved here from vox_render builds in the default
# workspace check; disable to drop the crucible-core dep chain.
default = ["crucible"]
crucible = ["vox_nodes/crucible"]

[dependencies]
vox_core    = { path = "../vox_core" }
vox_data    = { path = "../vox_data" }
vox_usd     = { path = "../vox_usd" }
vox_render  = { path = "../vox_render" }
# Node-graph editor windows (material/vfx/anim) moved here from vox_render — the
# renderer crate must stay free of the UI/node-DAG stack. These editors consume
# vox_nodes' OchrGraph + vox_ui's NodeGraphWidget.
vox_nodes   = { workspace = true }
vox_ui      = { path = "../vox_ui" }
glam        = { workspace = true }
half        = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
egui        = { workspace = true }
flate2      = "1"
hashbrown   = "0.15"
serde_json  = "1"
noise       = "0.9"
rand        = "0.8"
rand_pcg    = "0.3"
