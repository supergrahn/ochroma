[package]
name = "ochroma-tools"
edition.workspace = true
version.workspace = true
repository.workspace = true

[lib]
name = "vox_tools"
path = "src/lib.rs"

[[bin]]
name = "vox_tools"
path = "src/main.rs"

[[bin]]
name = "ochroma-tools"
path = "src/ochroma_main.rs"

[features]
default = []
# legacy-raster: OFF BY DEFAULT. Enables the `prune` subcommand's render guard,
# which renders candidate prunes through vox_render's banned CPU software
# rasterizer to back off visible hollowing. THE LAW: Spectra is the only product
# renderer, so the default build runs the pure (no-render) importance prune; the
# guard is preserved behind `--features legacy-raster`.
legacy-raster = ["vox_render/legacy-raster"]

[dependencies]
vox_core = { path = "../vox_core" }
vox_data = { path = "../vox_data" }
vox_usd  = { path = "../vox_usd" }
vox_render = { path = "../vox_render" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1"
glam = { workspace = true }
gltf = "1"
