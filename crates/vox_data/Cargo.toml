[package]
name = "vox_data"
edition.workspace = true
version.workspace = true

[dependencies]
vox_core = { path = "../vox_core" }
zstd = { workspace = true }
thiserror = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = "1"
uuid = { workspace = true }
half = { workspace = true }
glam = { workspace = true }
toml = { workspace = true }
rand = "0.9"
bevy_ecs = { workspace = true }
bevy_app = { workspace = true }
gltf = "1"
dirs-next = "2"
flate2 = "1"
# `.vxp` content addressing: the 32-hex entry id is the first 128 bits of a
# SHA-256 over the payload.
sha2 = "0.10"

[features]
# legacy-raster: opt-in for the PLY-render integration tests, which render
# loaded splats through vox_render's banned CPU software rasterizer. OFF by
# default so `cargo test` in the product build never compiles that stack.
# Run those tests with `cargo test -p vox_data --features legacy-raster`.
legacy-raster = ["vox_render/legacy-raster"]

[dev-dependencies]
vox_render = { path = "../vox_render" }
vox_core = { path = "../vox_core" }
glam = { workspace = true }
tempfile = "3"
